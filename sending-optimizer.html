async function getRolling7DayReceiving(hostId) {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/poppo_sending_transactions?host_id=eq.${hostId}&sent_at=gte.${encodeURIComponent(startDate.toISOString())}&select=received_amount`,
            {

                    "Authorization": `Bearer ${accessToken}`
                }
            }
        );

        if (!response.ok) {
            throw new Error(await response.text());
        }

        const transactions = await response.json();

        return transactions.reduce(
            (total, item) => total + Number(item.received_amount || 0),
            0
        );

    } catch (error) {

        return 0;
    }
}

function getRewardStatus(receiving) {
    const levels = [
        { level: "S", target: 50000000, reward: 480000 },
        { level: "A", target: 22000000, reward: 280000 },
        { level: "B", target: 10000000, reward: 150000 },
        { level: "C", target: 7000000, reward: 120000 },
        { level: "D", target: 4000000, reward: 84000 },
        { level: "E", target: 2000000, reward: 54000 },
        { level: "F", target: 1200000, reward: 36000 },
        { level: "G", target: 900000, reward: 27000 },
        { level: "H", target: 300000, reward: 10000 },
        { level: "I", target: 150000, reward: 6000 }
    ];

    let currentLevel = "No Reward";
    let currentReward = 0;

    for (const item of levels) {
        if (receiving >= item.target) {
            currentLevel = item.level;
            currentReward = item.reward;
            break;
        }
    }

    const nextLevels = [...levels]
        .reverse()
        .filter(item => item.target > receiving);

    const next = nextLevels.length ? nextLevels[0] : null;

    return {
        currentLevel,
        currentReward,
        nextLevel: next ? next.level : "MAX",
        nextTarget: next ? next.target : receiving,
        receivingNeeded: next ? next.target - receiving : 0
    };
}

const calculateOptimizerBtn = document.getElementById("calculateOptimizerBtn");
const availableSendingInput = document.getElementById("availableSending");
const senderRateInput = document.getElementById("senderRate");
const sellingRateInput = document.getElementById("sellingRate");
const optimizerResult = document.getElementById("optimizerResult");

const OPTIMIZER_STEP = 10000;
const RECEIVING_PERCENT = 0.70;
const AGENCY_SHARE_PERCENT = 0.20;
const POINTS_PER_USD = 10000;
const COINS_PER_USD = 9900;

const optimizerRewardLevels = [
    { level: "I", target: 150000, reward: 6000, rate: 3000, hours: 2 },
    { level: "H", target: 300000, reward: 10000, rate: 5000, hours: 2 },
    { level: "G", target: 900000, reward: 27000, rate: 9000, hours: 3 },
    { level: "F", target: 1200000, reward: 36000, rate: 12000, hours: 3 },
    { level: "E", target: 2000000, reward: 54000, rate: 18000, hours: 3 },
    { level: "D", target: 4000000, reward: 84000, rate: 28000, hours: 3 },
    { level: "C", target: 7000000, reward: 120000, rate: 40000, hours: 3 },
    { level: "B", target: 10000000, reward: 150000, rate: 50000, hours: 3 },
    { level: "A", target: 22000000, reward: 280000, rate: 70000, hours: 4 },
    { level: "S", target: 50000000, reward: 480000, rate: 120000, hours: 4 }
];

function optimizerRewardStatus(receiving) {
    let current = {
        level: "No Reward",
        target: 0,
        reward: 0,
        rate: 0,
        hours: 0
    };

    for (const item of optimizerRewardLevels) {
        if (receiving >= item.target) {
            current = item;
        }
    }

    return current;
}

// Platform withdrawal rule:
// Under $65 = 1.5%
// $65 and above = $1 only
function optimizerWithdrawalFee(usd) {
    if (usd <= 0) return 0;

    if (usd < 65) {
        return usd * 0.015;
    }

    return 1;
}

function optimizerStartOfDay(date) {
    const d = new Date(date);

    // Poppo day starts at 9:00 PM Pakistan time
    if (d.getHours() < 21) {
        d.setDate(d.getDate() - 1);
    }

    d.setHours(21, 0, 0, 0);
    return d;
}

function optimizerEndOfDay(date) {
    const d = optimizerStartOfDay(date);
    d.setDate(d.getDate() + 1);
    d.setMilliseconds(d.getMilliseconds() - 1);
    return d;
}

function optimizerOldReceivingForDay(transactions, dayAhead) {
    // Current Poppo day starts at 9 PM Pakistan time
    const currentPoppoDayStart = optimizerStartOfDay(new Date());

    // Move to the Poppo day we want to simulate
    const targetDayStart = new Date(currentPoppoDayStart);
    targetDayStart.setDate(targetDayStart.getDate() + dayAhead);

    // Rolling 7-day window:
    // target Poppo day + previous 6 Poppo days
    const windowStart = new Date(targetDayStart);
    windowStart.setDate(windowStart.getDate() - 6);

    const windowEnd = new Date(targetDayStart);
    windowEnd.setDate(windowEnd.getDate() + 1);
    windowEnd.setMilliseconds(windowEnd.getMilliseconds() - 1);

    let total = 0;

    for (const item of transactions) {
        const transactionDate = new Date(item.sent_at);

        if (
            transactionDate >= windowStart &&
            transactionDate <= windowEnd
        ) {
            total += Number(item.received_amount || 0);
        }
    }

    return total;
}
function optimizerEvaluateHost(host, sending, sellingRate) {
    const newReceiving = Math.round(sending * RECEIVING_PERCENT);

    // -----------------------------
    // Normal sending economics
    // -----------------------------

    const hostGrossUSD = newReceiving / POINTS_PER_USD;

    const hostWithdrawalFee =
        optimizerWithdrawalFee(hostGrossUSD);

    const hostNetUSD =
        Math.max(0, hostGrossUSD - hostWithdrawalFee);

    // Agency gets 20% share.
    // No withdrawal fee on agency share.
    const agencySharePoints =
        newReceiving * AGENCY_SHARE_PERCENT;

    const agencyUSD =
        agencySharePoints / POINTS_PER_USD;

    const hostSaleableCoins =
        hostNetUSD * COINS_PER_USD;

    const agencySaleableCoins =
        agencyUSD * COINS_PER_USD;

    const normalSaleableCoins =
        hostSaleableCoins + agencySaleableCoins;

    const normalSaleValue =
        (normalSaleableCoins / 100000) * sellingRate;

    // -----------------------------
    // Exact next 7-day reward
    // -----------------------------

    const rewardByDay = [];
    const receivingByDay = [];
    const levelByDay = [];

    let weeklyRewardPoints = 0;
let baselineWeeklyRewardPoints = 0;
    for (let day = 0; day < 7; day++) {
        const oldReceiving =
            optimizerOldReceivingForDay(
                host.transactions,
                day
            );

        // Today's recommended sending remains
        // in rolling 7-day window for Day 1-7.
        const rollingReceiving =
            oldReceiving + newReceiving;
const baselineStatus = optimizerRewardStatus(oldReceiving);
baselineWeeklyRewardPoints += baselineStatus.reward;
        const status =
            optimizerRewardStatus(rollingReceiving);

        receivingByDay.push(rollingReceiving);
        levelByDay.push(status.level);
        rewardByDay.push(status.reward);

        weeklyRewardPoints += status.reward;
    }
const extraWeeklyRewardPoints =
    Math.max(0, weeklyRewardPoints - baselineWeeklyRewardPoints);
    // Reward is also converted using the
    // same platform withdrawal rule.
    const rewardGrossUSD =
       extraWeeklyRewardPoints / POINTS_PER_USD;

    const rewardWithdrawalFee =
        optimizerWithdrawalFee(rewardGrossUSD);

    const rewardNetUSD =
    Math.max(
        0,
        rewardGrossUSD - rewardWithdrawalFee
    );

// Salary Base = 100% reward ours
// Half-Half = 50% reward ours
const ourRewardNetUSD =
    host.host_type === "halfhalf"
        ? rewardNetUSD * 0.50
        : rewardNetUSD;

const rewardSaleableCoins =
    ourRewardNetUSD * COINS_PER_USD;
    const rewardSaleValue =
        (rewardSaleableCoins / 100000) * sellingRate;

    const totalSaleableCoins =
        normalSaleableCoins + rewardSaleableCoins;

    const totalSaleValue =
        normalSaleValue + rewardSaleValue;

    return {
        sending,
        newReceiving,

        hostGrossUSD,
        hostWithdrawalFee,
        hostNetUSD,

        agencySharePoints,
        agencyUSD,

        hostSaleableCoins,
        agencySaleableCoins,
        normalSaleableCoins,
        normalSaleValue,

        rewardByDay,
        receivingByDay,
        levelByDay,
        weeklyRewardPoints,
baselineWeeklyRewardPoints,
extraWeeklyRewardPoints,
        rewardGrossUSD,
        rewardWithdrawalFee,
        rewardNetUSD,
        rewardSaleableCoins,
        rewardSaleValue,

        totalSaleableCoins,
        totalSaleValue
    };
}

        return;

    if (!senderRateValue || !sellingRateValue) {
        optimizerResult.innerHTML =
            `<span style="color:#ff5c5c;">

        return;
    }

    availableSending =
        Math.floor(
            availableSending / OPTIMIZER_STEP

    optimizerResult.innerHTML =
        `<span style="color:#ffd700;">
            Checking full 7-day history and finding maximum profit...
        </span>`;

    calculateOptimizerBtn.disabled = true;

    try {

        // ======================================
        // LOAD HOSTS
        // ======================================

        const hostResponse = await fetch(
            `${SUPABASE_URL}/rest/v1/poppo_hosts?select=*&order=created_at.asc`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${accessToken}`
                }
            }
        );

        if (!hostResponse.ok) {
            throw new Error(
                await hostResponse.text()
            );
        }

       const allHosts = await hostResponse.json();

const selectedHostType =
    document.getElementById("optimizerHostType").value;

const hosts = allHosts.filter(
    host => host.host_type === selectedHostType
);

        if (!hosts.length) {
            optimizerResult.innerHTML =
                `<span style="color:#ff5c5c;">
                    No saved hosts found.
                </span>`;
            return;
        }

        // ======================================
        // LOAD EACH HOST HISTORY ONCE
        // ======================================

        const hostData = [];

        for (const host of hosts) {

            const historyResponse = await fetch(
                `${SUPABASE_URL}/rest/v1/poppo_sending_transactions?host_id=eq.${host.id}&select=received_amount,sent_at&order=sent_at.asc`,
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${accessToken}`
                    }
                }
            );

            if (!historyResponse.ok) {
                throw new Error(
                    await historyResponse.text()
                );
            }

            const transactions =
                await historyResponse.json();

            const currentReceiving =
                optimizerOldReceivingForDay(
                    transactions,
                    0
                );

            hostData.push({
                ...host,
                transactions,
                currentReceiving
            });
        }

        // ======================================
        // BUILD EVERY POSSIBLE ALLOCATION
        // FOR EACH HOST
        // ======================================

        const totalUnits =
            availableSending / OPTIMIZER_STEP;

        const candidates = [];

        for (const host of hostData) {

            const hostCandidates = [];

            for (
                let units = 0;
                units <= totalUnits;
                units++
            ) {

                const sending =
                    units * OPTIMIZER_STEP;

                const evaluation =
                    optimizerEvaluateHost(
                        host,
                        sending,
                        sellingRateValue
                    );

                hostCandidates.push(
                    evaluation
                );
            }

            candidates.push(
                hostCandidates
            );
        }

        // ======================================
        // DYNAMIC PROGRAMMING
        //
        // Finds the allocation of ALL sending
        // which gives maximum 7-day sale value.
        //
        // Sender payment is fixed for the total
        // sending, so maximizing sale value also
        // maximizes final profit.
        // ======================================

        let previous =
            new Array(totalUnits + 1)
                .fill(-Infinity);

        previous[0] = 0;

        const choices = [];

        for (
            let hostIndex = 0;
            hostIndex < hostData.length;
            hostIndex++
        ) {

            const current =
                new Array(totalUnits + 1)
                    .fill(-Infinity);

            const hostChoice =
                new Array(totalUnits + 1)
                    .fill(-1);

            for (
                let alreadyUsed = 0;
                alreadyUsed <= totalUnits;
                alreadyUsed++
            ) {

                if (
                    previous[alreadyUsed] ===
                    -Infinity
                ) {
                    continue;
                }

                const maxUnitsForHost =
                    totalUnits - alreadyUsed;

                for (
                    let hostUnits = 0;
                    hostUnits <= maxUnitsForHost;
                    hostUnits++
                ) {

                    const newTotal =
                        alreadyUsed + hostUnits;

                    const candidateValue =
    previous[alreadyUsed] +
    candidates[hostIndex][hostUnits]
        .totalSaleValue;
                    if (
                        candidateValue >
                        current[newTotal]
                    ) {

                        current[newTotal] =
                            candidateValue;

                        hostChoice[newTotal] =
                            hostUnits;
                    }
                }
            }

            previous = current;
            choices.push(hostChoice);
        }

        // ======================================
        // REBUILD WINNING DISTRIBUTION
        // ======================================

        const selectedUnits =
            new Array(hostData.length)
                .fill(0);

        let unitsLeft =
            totalUnits;

        for (
            let hostIndex =
                hostData.length - 1;
            hostIndex >= 0;
            hostIndex--
        ) {

            const units =
                choices[hostIndex][unitsLeft];

            if (units < 0) {
                throw new Error(
                    "Unable to rebuild optimizer result."
                );
            }

            selectedUnits[hostIndex] =
                units;

            unitsLeft -= units;
        }

        const allocations = [];

        for (
            let i = 0;
            i < hostData.length;
            i++
        ) {

            const units =
                selectedUnits[i];

            if (units <= 0) {
                continue;
            }

            const evaluation =
                candidates[i][units];

            allocations.push({
                ...hostData[i],
                ...evaluation
            });
        }

        // ======================================
        // TOTALS
        // ======================================

        const senderPayment =
            (availableSending / 100000) *
            senderRateValue;

        let totalHostReceiving = 0;

        let totalHostGrossUSD = 0;
        let totalHostWithdrawalFee = 0;
        let totalHostNetUSD = 0;

        let totalAgencySharePoints = 0;
        let totalAgencyUSD = 0;

        let totalNormalSaleableCoins = 0;
        let totalNormalSaleValue = 0;

        let totalWeeklyRewardPoints = 0;
        let totalRewardGrossUSD = 0;
        let totalRewardWithdrawalFee = 0;
        let totalRewardNetUSD = 0;
        let totalOurRewardNetUSD = 0;
        let totalRewardSaleableCoins = 0;
        let totalRewardSaleValue = 0;

        let totalSaleableCoins = 0;
        let totalSaleValue = 0;

        const totalRewardByDay =
            [0, 0, 0, 0, 0, 0, 0];

        for (const host of allocations) {

            totalHostReceiving +=
                host.newReceiving;

            totalHostGrossUSD +=
                host.hostGrossUSD;

            totalHostWithdrawalFee +=
                host.hostWithdrawalFee;

            totalHostNetUSD +=
                host.hostNetUSD;

            totalAgencySharePoints +=
                host.agencySharePoints;

            totalAgencyUSD +=
                host.agencyUSD;

            totalNormalSaleableCoins +=
                host.normalSaleableCoins;

            totalNormalSaleValue +=
                host.normalSaleValue;

            totalWeeklyRewardPoints +=
                host.weeklyRewardPoints;

            totalRewardGrossUSD +=
                host.rewardGrossUSD;

            totalRewardWithdrawalFee +=
                host.rewardWithdrawalFee;

            totalRewardNetUSD +=
                host.rewardNetUSD;
totalOurRewardNetUSD +=
    host.host_type === "halfhalf"
        ? host.rewardNetUSD * 0.50
        : host.rewardNetUSD;
            totalRewardSaleableCoins +=
                host.rewardSaleableCoins;

            totalRewardSaleValue +=
                host.rewardSaleValue;

            totalSaleableCoins +=
                host.totalSaleableCoins;

            totalSaleValue +=
                host.totalSaleValue;

            for (
                let day = 0;
                day < 7;
                day++
            ) {
                totalRewardByDay[day] +=
                    host.rewardByDay[day];
            }
        }

        const weeklyProfit =
            totalSaleValue - senderPayment;

        const breakEvenRate =
            totalSaleableCoins > 0
                ? (
                    senderPayment /
                    totalSaleableCoins
                ) * 100000
                : 0;

        // ======================================
        // RESULT HTML
        // ======================================

        let resultHTML = `
            <h3>Best 7-Day Profit Distribution</h3>

            <p style="color:#aaa;">
                Optimized using previous 6-day receiving,
                expiry dates and full next 7-day reward.
            </p>
        `;

        allocations.forEach(
            (host, index) => {

                const todayStatus =
                    optimizerRewardStatus(
                        host.receivingByDay[0]
                    );

                const levelInfo =
                    optimizerRewardLevels.find(
                        item =>
                            item.level ===
                            todayStatus.level
                    );

                resultHTML += `
                    <div style="
                        margin:12px 0;
                        padding:12px;
                        border:1px solid #444;
                        border-radius:8px;
                    ">

                        <strong>
                            ${index + 1}. ${host.host_name}
                        </strong><br>

                        Poppo ID:
                        <strong>${host.poppo_id}</strong><br>

                        Send:
                        <strong>
                            ${host.sending.toLocaleString()}
                        </strong><br>

                        Expected Receiving:
                        ${host.newReceiving.toLocaleString()}<br>

                        Current 7-Day:
                        ${host.currentReceiving.toLocaleString()}<br>

                        Projected Today:
                        ${host.receivingByDay[0].toLocaleString()}<br>

                        Reward Level Today:
                        <strong>${todayStatus.level}</strong><br>

                        ${
                            levelInfo
                                ? `${levelInfo.rate.toLocaleString()}/H × ${levelInfo.hours}H = ${levelInfo.reward.toLocaleString()}/day`
                                : `No Reward`
                        }

                        <br><br>

                       <strong>
    Full 7-Day Reward:
    ${host.weeklyRewardPoints.toLocaleString()}
</strong><br>

Old Sending Already Expected Reward:
${host.baselineWeeklyRewardPoints.toLocaleString()}<br>

<strong>
    New Sending Extra Reward:
    ${host.extraWeeklyRewardPoints.toLocaleString()}
</strong><br><br>
                        Day 1:
                        ${host.rewardByDay[0].toLocaleString()}
                        (${host.levelByDay[0]})<br>

                        Day 2:
                        ${host.rewardByDay[1].toLocaleString()}
                        (${host.levelByDay[1]})<br>

                        Day 3:
                        ${host.rewardByDay[2].toLocaleString()}
                        (${host.levelByDay[2]})<br>

                        Day 4:
                        ${host.rewardByDay[3].toLocaleString()}
                        (${host.levelByDay[3]})<br>

                        Day 5:
                        ${host.rewardByDay[4].toLocaleString()}
                        (${host.levelByDay[4]})<br>

                        Day 6:
                        ${host.rewardByDay[5].toLocaleString()}
                        (${host.levelByDay[5]})<br>

                        Day 7:
                        ${host.rewardByDay[6].toLocaleString()}
                        (${host.levelByDay[6]})<br>

                        <br>

                        Host Gross:
                        $${host.hostGrossUSD.toFixed(2)}<br>

                        Host Withdrawal Fee:
                        $${host.hostWithdrawalFee.toFixed(2)}<br>

                        Agency Share:
                        ${Math.round(host.agencySharePoints).toLocaleString()}
                        ($${host.agencyUSD.toFixed(2)})
                        — No Fee<br>

                        Normal Saleable Coins:
                        ${Math.round(host.normalSaleableCoins).toLocaleString()}<br>

                        Reward Saleable Coins:
                        ${Math.round(host.rewardSaleableCoins).toLocaleString()}<br>

                        Total Sale Value:
                        <strong>
                            Rs ${Math.round(host.totalSaleValue).toLocaleString()}
                        </strong>
<br><br>

<button
    type="button"
    class="optimizer-copy-btn"
    data-host-index="${index}">
    Copy
</button>

<button
    type="button"
    class="optimizer-whatsapp-btn"
    data-host-index="${index}">
    Share on WhatsApp
</button>
                    </div>
                `;
            }
        );

        resultHTML += `

            <hr style="margin:20px 0;border-color:#444;">

            <h3>7-Day Summary</h3>

            <strong>Total Sending:</strong>
            ${availableSending.toLocaleString()}<br>

            <strong>Total Expected Receiving:</strong>
            ${totalHostReceiving.toLocaleString()}<br><br>

            <strong>Sender Rate:</strong>
            Rs ${senderRateValue.toLocaleString()} / 100K<br>

            <strong>Sender Payment:</strong>
            Rs ${Math.round(senderPayment).toLocaleString()}<br><br>

            <strong>Host Gross:</strong>
            $${totalHostGrossUSD.toFixed(2)}<br>

            <strong>Host Withdrawal Fees:</strong>
            $${totalHostWithdrawalFee.toFixed(2)}<br>

            <strong>Host Net:</strong>
            $${totalHostNetUSD.toFixed(2)}<br><br>

            <strong>Agency Share (20%):</strong>
            ${Math.round(totalAgencySharePoints).toLocaleString()}<br>

            <strong>Agency USD — No Fee:</strong>
            $${totalAgencyUSD.toFixed(2)}<br><br>

            <strong>Host + Agency Saleable Coins:</strong>
            ${Math.round(totalNormalSaleableCoins).toLocaleString()}<br>

            <strong>Normal Sale Value:</strong>
            Rs ${Math.round(totalNormalSaleValue).toLocaleString()}

            <hr style="margin:15px 0;border-color:#444;">

            <h3>7-Day Reward</h3>

            Day 1:
            ${totalRewardByDay[0].toLocaleString()}<br>

            Day 2:
            ${totalRewardByDay[1].toLocaleString()}<br>

            Day 3:
            ${totalRewardByDay[2].toLocaleString()}<br>

            Day 4:
            ${totalRewardByDay[3].toLocaleString()}<br>

            Day 5:
            ${totalRewardByDay[4].toLocaleString()}<br>

            Day 6:
            ${totalRewardByDay[5].toLocaleString()}<br>

            Day 7:
            ${totalRewardByDay[6].toLocaleString()}<br><br>

            <strong>Total 7-Day Reward:</strong>
            ${totalWeeklyRewardPoints.toLocaleString()}<br>

            Reward Gross:
            $${totalRewardGrossUSD.toFixed(2)}<br>

            Reward Withdrawal Fees:
            $${totalRewardWithdrawalFee.toFixed(2)}<br>

            Reward Net After Fee:
$${totalRewardNetUSD.toFixed(2)}<br>

${selectedHostType === "halfhalf"
    ? `FH EMPIRE 50% Reward:
       <strong>$${totalOurRewardNetUSD.toFixed(2)}</strong><br>
       Host 50% Reward:
       $${totalOurRewardNetUSD.toFixed(2)}<br>`
    : `FH EMPIRE Reward:
       <strong>$${totalOurRewardNetUSD.toFixed(2)}</strong><br>`
}

            Reward Saleable Coins:
            ${Math.round(totalRewardSaleableCoins).toLocaleString()}<br>

            Reward Sale Value:
            <strong>
                Rs ${Math.round(totalRewardSaleValue).toLocaleString()}
            </strong>

            <hr style="margin:15px 0;border-color:#444;">

            <h3>Final Profit</h3>

            <strong>Selling Rate:</strong>
            Rs ${sellingRateValue.toLocaleString()} / 100K<br>

            <strong>Total Saleable Coins:</strong>
            ${Math.round(totalSaleableCoins).toLocaleString()}<br>

            <strong>Total Sale Value:</strong>
            Rs ${Math.round(totalSaleValue).toLocaleString()}<br>

            <strong>Sender Payment:</strong>
            Rs ${Math.round(senderPayment).toLocaleString()}<br><br>

            <strong>
                Break-even Selling Rate:
                Rs ${Math.ceil(breakEvenRate).toLocaleString()} / 100K
            </strong>

            <div style="
                margin-top:15px;
                padding:12px;
                border:1px solid #444;
                border-radius:8px;
                font-size:22px;
                color:${weeklyProfit >= 0 ? "#2ecc71" : "#ff5c5c"};
            ">

                MAXIMUM PROJECTED 7-DAY
                ${weeklyProfit >= 0 ? "PROFIT" : "LOSS"}:

                <strong>
                    Rs ${Math.abs(
                        Math.round(weeklyProfit)
                    ).toLocaleString()}
                </strong>

            </div>
        `;

        optimizerResult.innerHTML =
            resultHTML;
// ======================================
// HOST COPY + WHATSAPP SHARE BUTTONS
// ======================================

document.querySelectorAll(".optimizer-copy-btn").forEach(button => {
    button.addEventListener("click", async () => {

        const index = Number(button.dataset.hostIndex);
        const host = allocations[index];

        if (!host) return;

        const shareText =
`Host Name: ${host.host_name}
Host ID: ${host.poppo_id}
Coins Send: ${host.sending.toLocaleString()}
Points Received: ${host.newReceiving.toLocaleString()}`;

        try {
            await navigator.clipboard.writeText(shareText);

            const oldText = button.textContent;
            button.textContent = "Copied ✓";

            setTimeout(() => {
                button.textContent = oldText;
            }, 1500);

        } catch (error) {
            console.error("Copy failed:", error);
        }
    });
});


document.querySelectorAll(".optimizer-whatsapp-btn").forEach(button => {
    button.addEventListener("click", () => {

        const index = Number(button.dataset.hostIndex);
        const host = allocations[index];

        if (!host) return;

        const shareText =
`Host Name: ${host.host_name}
Host ID: ${host.poppo_id}
Coins Send: ${host.sending.toLocaleString()}
Points Received: ${host.newReceiving.toLocaleString()}`;

        const whatsappURL =
            `https://wa.me/?text=${encodeURIComponent(shareText)}`;

        window.open(whatsappURL, "_blank");
    });
});
    } catch (error) {

        console.error(
            "Final optimizer error:",
            error
        );

        optimizerResult.innerHTML =
            `<span style="color:#ff5c5c;">
                Unable to calculate distribution.
                Please check console.
            </span>`;

    } finally {

        calculateOptimizerBtn.disabled =
            false;
    }
}); 
// Load dropdown when page opens
loadSendingHosts();
loadSavedHosts();
</script>
       
</body>
</html>

document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    const amount = params.get("amount");
    const isCustom = params.get("custom") === "true";

    const coinPackage = document.getElementById("coinPackage");
    const customAmountBox = document.getElementById("customAmountBox");
    const customAmount = document.getElementById("customAmount");
    const coinCalculation = document.getElementById("coinCalculation");

    const selectedCoins = document.getElementById("selectedCoins");
    const selectedPrice = document.getElementById("selectedPrice");

    const packages = {
        "250": {
            coins: "8,000 Coins",
            price: "Rs. 250"
        },
        "500": {
            coins: "16,000 Coins",
            price: "Rs. 500"
        },
        "1500": {
            coins: "50,000 Coins",
            price: "Rs. 1,500"
        },
        "3000": {
            coins: "100,000 Coins",
            price: "Rs. 3,000"
        }
    };


    // CALCULATE CUSTOM COINS
    function updateCustomCoins() {

        const value = Number(customAmount.value);

        if (value >= 250) {

            const blocks = Math.floor(value / 1500);
            const remaining = value % 1500;

            const coins = (blocks * 50000) + (remaining * 32);

            coinCalculation.textContent =
                "You will receive: " +
                coins.toLocaleString() +
                " Coins";

            selectedCoins.textContent =
                coins.toLocaleString() + " Coins";

            selectedPrice.textContent =
                "Rs. " + value.toLocaleString();

        } else {

            coinCalculation.textContent =
                "Minimum order is Rs. 250";

            selectedCoins.textContent = "Custom Amount";
            selectedPrice.textContent = "Minimum Rs. 250";
        }
    }


    // PACKAGE DROPDOWN CHANGE
    coinPackage.addEventListener("change", function () {

        if (this.value === "custom") {

            customAmountBox.style.display = "block";
            customAmount.required = true;

            if (!customAmount.value) {
                customAmount.value = 250;
            }

            updateCustomCoins();

        } else {

            customAmountBox.style.display = "none";
            customAmount.required = false;

            if (packages[this.value]) {
                selectedCoins.textContent =
                    packages[this.value].coins;

                selectedPrice.textContent =
                    packages[this.value].price;
            }
        }
    });


    // CUSTOM AMOUNT LIVE CALCULATION
    customAmount.addEventListener("input", function () {
        updateCustomCoins();
    });


    // OPEN NORMAL PACKAGE FROM URL
    if (amount && packages[amount]) {

        coinPackage.value = amount;

        selectedCoins.textContent =
            packages[amount].coins;

        selectedPrice.textContent =
            packages[amount].price;

        coinPackage.dispatchEvent(new Event("change"));
    }


    // OPEN CUSTOM ORDER FROM URL
    if (isCustom) {

        coinPackage.value = "custom";
        customAmount.value = 250;

        coinPackage.dispatchEvent(new Event("change"));
    }
// ===============================
// ORDER SUBMIT
// ===============================

const SUPABASE_URL =
    "https://vmllowldjzwmzsvxccui.supabase.co/rest/v1/";

const SUPABASE_KEY =
    "sb_publishable_4_cDtsB6pZJHW-2dQW8NHQ_LQhpCn1Q";

const poppoOrderForm =
    document.getElementById("poppoOrderForm");

const orderResult =
    document.getElementById("orderResult");

// POPPO ID VERIFICATION
const poppoIdInput = document.getElementById("poppoId");
const poppoVerifyResult = document.getElementById("poppoVerifyResult");

let verifiedPoppoId = "";
let verifiedPoppoNickname = "";

// Hide account options immediately when Poppo ID changes
poppoIdInput.addEventListener("input", function () {
    verifiedPoppoId = "";
    verifiedPoppoNickname = "";

    const accountSection =
        document.getElementById("accountTypeSection");

    if (accountSection) {
        accountSection.style.display = "none";

        const userRadio = accountSection.querySelector(
            'input[name="accountType"][value="user"]'
        );

        if (userRadio) {
            userRadio.checked = true;
        }
    }

    poppoVerifyResult.innerHTML = "";
});

poppoIdInput.addEventListener("blur", async function () {
    const poppoId = poppoIdInput.value.trim();

    verifiedPoppoId = "";
    verifiedPoppoNickname = "";

const accountSection = document.getElementById("accountTypeSection");

if (accountSection) {
    accountSection.style.display = "none";

    const userRadio = accountSection.querySelector(
        'input[name="accountType"][value="user"]'
    );

    if (userRadio) {
        userRadio.checked = true;
    }
}

    if (!poppoId || !/^\d+$/.test(poppoId)) {
        poppoVerifyResult.innerHTML =
            '<span style="color:#ff5c5c;">✕ Please enter a valid Poppo ID</span>';
        return;
    }

    poppoVerifyResult.innerHTML =
        '<span style="color:#ffd700;">Checking Poppo account...</span>';

    try {
        const response = await fetch(
            "https://vmllowldjzwmzsvxccui.supabase.co/functions/v1/poppo-profile",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    poppoId: poppoId
                })
            }
        );

        const data = await response.json();

if (poppoIdInput.value.trim() !== poppoId) {
    return;
}

if (response.ok && data.success &&
    String(data.id) !== poppoId) {
    poppoVerifyResult.innerHTML =
        '<span style="color:#ff5c5c;">✕ Poppo ID verification mismatch</span>';
    return;
}

        if (response.ok && data.success) {
            verifiedPoppoId = String(data.id);
            verifiedPoppoNickname = data.nickname;

document.getElementById("accountTypeSection").style.display = "block";

          
poppoVerifyResult.innerHTML = `
    <span style="color:#22c55e;">✓ Account Found:</span>
    <span style="color:#ffffff; font-weight:600;">
        ${data.nickname}
    </span>
`;

        } else {
            poppoVerifyResult.innerHTML =
                '<span style="color:#ff5c5c;">✕ Poppo account not found</span>';
        }

    } catch (error) {
        poppoVerifyResult.innerHTML =
            '<span style="color:#ff5c5c;">✕ Unable to verify Poppo ID</span>';
    }
});

// FH EMPIRE - Prevent duplicate submissions
let orderSubmitting = false;
let currentRequestKey = null;

poppoOrderForm.addEventListener("submit", async function (e) {

    e.preventDefault();

if (orderSubmitting) return;

if (!currentRequestKey) {
    currentRequestKey = crypto.randomUUID();
}

orderSubmitting = true;

const submitBtn = e.submitter;

submitBtn.disabled = true;
submitBtn.textContent = "Placing Order...";

function unlockOrderForm() {
    orderSubmitting = false;
    submitBtn.disabled = false;
    submitBtn.textContent = "Place Order";
}

    const customerName =
        document.getElementById("customerName").value.trim();

    const whatsappNumber =
        document.getElementById("whatsappNumber").value.trim();

    const poppoId =
        document.getElementById("poppoId").value.trim();
if (!verifiedPoppoId || verifiedPoppoId !== poppoId) {
    orderResult.innerHTML = `
        <div class="order-error">
            Please enter a valid verified Poppo ID.
        </div>
    `;
   unlockOrderForm();
return;
}
    const paymentMethod =
        document.getElementById("paymentMethod").value;


    let orderAmount = 0;

    if (coinPackage.value === "custom") {
        orderAmount = Number(customAmount.value);
    } else {
        orderAmount = Number(coinPackage.value);
    }


    if (orderAmount < 250) {

        orderResult.innerHTML = `
            <div class="order-error">
                Minimum order is Rs. 250.
            </div>
        `;
unlockOrderForm();
        return;
    }


    const blocks = Math.floor(orderAmount / 1500);
    const remaining = orderAmount % 1500;

    const orderCoins =
        (blocks * 50000) + (remaining * 32);


    try {

        const response = await fetch(
            `${SUPABASE_URL}rpc/create_order_secure`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                },

               
body: JSON.stringify({
    p_customer_name: customerName,
    p_whatsapp_number: whatsappNumber,
    p_poppo_id: poppoId,
    p_coins: orderCoins,
    p_amount: orderAmount,
    p_payment_method: paymentMethod,
    p_account_type: document.querySelector(
        'input[name="accountType"]:checked'
    )?.value || "user",
   p_request_key: currentRequestKey,
p_poppo_nickname: verifiedPoppoNickname
})

            }
        );


        if (!response.ok) {

            const errorText = await response.text();

            console.error(
                "Supabase error:",
                errorText
            );

            orderResult.innerHTML = `
                <div class="order-error">
                    Order save nahi hua. Please try again.
                </div>
            `;
unlockOrderForm();
            return;
        }


        const result = await response.json();

if (!Array.isArray(result) || !result[0]?.order_id || !result[0]?.access_token) {
    throw new Error("Invalid secure order response");
}

const finalOrderId = result[0].order_id;
const orderAccessToken = result[0].access_token;

sessionStorage.setItem(
    "fh_order_access_" + finalOrderId,
    orderAccessToken
);

        // ADMIN PUSH NOTIFICATION
        try {

            const projectUrl =
    SUPABASE_URL.replace(/\/rest\/v1\/?$/, "");
            await fetch(
                `${projectUrl}/functions/v1/send-push`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    },

                    body: JSON.stringify({

                        title:
                            "🛒 New FH EMPIRE Order",

                        body:
                            `${orderCoins.toLocaleString()} Coins - Rs. ${orderAmount.toLocaleString()} | Poppo ID: ${poppoId} | Order: ${finalOrderId}`,

                        url: "admin.html"
                    })
                }
            );

        } catch (pushError) {

            console.error(
                "Push notification failed:",
                pushError
            );
        }


        // SUCCESS DETAILS
        orderResult.innerHTML = `
            <div class="order-success">

                <h3>Order Received ✅</h3>

                <p class="order-id">
                    Order ID:
                    <strong>${finalOrderId}</strong>
                </p>

                <div class="order-summary">

                    <p>
                        <span>Name:</span>
                        ${customerName}
                    </p>

                    <p>
                        <span>Poppo ID:</span>
                        ${poppoId}
                    </p>

                    <p>
                        <span>Coins:</span>
                        ${orderCoins.toLocaleString()}
                    </p>

                    <p>
                        <span>Amount:</span>
                        Rs. ${orderAmount.toLocaleString()}
                    </p>

                    <p>
                        <span>Payment:</span>
                        ${paymentMethod}
                    </p>

                    <p>
                        <span>Status:</span>
                        Pending
                    </p>

                </div>

                <p class="order-note">
                    Please save your Order ID for tracking.
                </p>

            </div>
        `;


       // FH EMPIRE - Redirect to Order Processing Page
const processingUrl = new URL("order-processing.html", window.location.href);

processingUrl.searchParams.set("order_id", finalOrderId);
sessionStorage.setItem(
    "fh_order_access_" + finalOrderId,
    orderAccessToken
);
// FH EMPIRE - Save Order Summary for Processing Page
sessionStorage.setItem("fh_pending_order", JSON.stringify({
    orderId: finalOrderId,
    poppoId: poppoId,
    accountType: document.querySelector(
        'input[name="accountType"]:checked'
    )?.value || "user",
    coins: orderCoins,
    amount: orderAmount,
    paymentMethod: paymentMethod
}));
window.location.href = processingUrl.href;

    } catch (error) {

        console.error("Order error:", error);

        orderResult.innerHTML = `
            <div class="order-error">
                Something went wrong. Please try again.
            </div>
        `;
        unlockOrderForm();
    }

});

});  // DOMContentLoaded END

</script>
